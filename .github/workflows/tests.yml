name: Tests

on:
  push:
    branches: ['20.0']
  pull_request:
    branches: ['20.0']
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install ruff pylint-odoo
      - name: ruff
        run: ruff check .
      - name: pylint-odoo
        run: pylint --rcfile=.pylintrc om_*

  tests:
    name: tests (${{ matrix.name }})
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: with accounting
            modules: om_hrms,om_hr_payroll_account
          - name: without accounting
            modules: om_hrms
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: odoo
      PGPASSWORD: odoo
      ODOO_PATH: ${{ github.workspace }}/odoo
      LOG_DIR: ${{ github.workspace }}/logs
    steps:
      - uses: actions/checkout@v4
        with:
          path: hr
      - uses: ./hr/.github/actions/setup-odoo
      - name: Install and test
        run: hr/.github/scripts/run_odoo_tests.sh test_suite "${{ matrix.modules }}"
      - name: Log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: log-${{ strategy.job-index }}
          path: logs/
