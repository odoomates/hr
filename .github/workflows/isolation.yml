name: Modules alone

# every module installs alone, with its demo data, and its tests pass: nobody needs the whole suite
on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  modules:
    runs-on: ubuntu-24.04
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: echo "list=$(ls -d om_* | grep -v '^om_hrms$' | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"

  module:
    needs: modules
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        module: ${{ fromJSON(needs.modules.outputs.list) }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: odoo
      PGPASSWORD: odoo
      ODOO_PATH: ${{ github.workspace }}/odoo
      LOG_DIR: ${{ github.workspace }}/logs
    steps:
      - uses: actions/checkout@v4
        with:
          path: hr
      - uses: ./hr/.github/actions/setup-odoo
      - name: Install alone and test
        run: hr/.github/scripts/run_odoo_tests.sh "test_${{ matrix.module }}" "${{ matrix.module }}" "/${{ matrix.module }}"
      - name: Log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: log-${{ matrix.module }}
          path: logs/
